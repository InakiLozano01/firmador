<VirtualHost *:5000>
    ServerName localhost

    WSGIDaemonProcess flaskapp python-path=/app user=www-data group=www-data threads=5
    WSGIScriptAlias / /app/config/sign.wsgi

    # Keep only timestamp + Python message in Apache error logs.
    ErrorLogFormat "[%t] - %M"
    ErrorLogFormat request "[%t] - %M"
    ErrorLogFormat connection "[%t] - %M"

    <Directory /app>
        Require all granted
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Options FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/flaskapp_error.log
    CustomLog ${APACHE_LOG_DIR}/flaskapp_access.log combined
</VirtualHost>
