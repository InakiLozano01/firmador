services:

  
  flask-app:
    container_name: firmador-python-facundo
    restart: always
    build:
      context: ./firmar_python/app
      dockerfile: Dockerfile
    ports:
      - "5022:5000"
    environment:
      - TZ=Etc/GMT+3
    volumes:
      - ./firmar_python/app:/app
      - ./firmar_python/app/assets:/app/assets
      - /qnap/indice_migracion:/app/expedientes
      - /qnap/documentos_firmados:/var/documentos_firmados
      - ../../documentos:/var/documentos
    networks:
      - firmador_signnet

networks:
  firmador_signnet:
    driver: bridge
