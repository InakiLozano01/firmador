services:
  redis:
    container_name: firmador-redis
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - firmador_signnet

  java-webapp:
    container_name: firmador-java
    restart: always
    build:
      context: ./dssapp
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - TZ=Etc/GMT+3
    networks:
      - firmador_signnet

  flask-app:
    container_name: firmador-python
    restart: always
    build:
      context: ./firmar_python/app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - env/common.env
      - env/flask-app.env
      - env/redis.env
      - env/obs-db.env
    volumes:
      - ./firmar_python/app:/app
      - ./firmar_python/app/assets:/app/assets
      - /qnap/indice_migracion:/app/expedientes
      - /qnap/documentos_firmados:/var/documentos_firmados
      - /home/espaciodocker/devenv/documentos:/var/documentos
    depends_on:
      java-webapp:
        condition: service_started
      redis:
        condition: service_healthy
      obs-postgres:
        condition: service_healthy
    networks:
      - firmador_signnet

  obs-postgres:
    container_name: firmador-obs-postgres
    image: postgres:16-alpine
    restart: always
    env_file:
      - env/common.env
      - env/obs-postgres.env
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs_user -d obs_dashboard"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - obs_postgres_data:/var/lib/postgresql/data
      - ./dashboard/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - firmador_signnet

  dashboard:
    container_name: firmador-dashboard
    restart: always
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3113:3000"
    env_file:
      - env/common.env
      - env/obs-db.env
      - env/dashboard.env
    depends_on:
      obs-postgres:
        condition: service_healthy
    networks:
      - firmador_signnet

volumes:
  redis_data:
  obs_postgres_data:

networks:
  firmador_signnet:
    driver: bridge
